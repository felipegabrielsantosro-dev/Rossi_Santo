<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Flamengo CRM</title>

  <!-- Bootstrap -->
  <link 
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
    rel="stylesheet"
  />

  <!-- Icons -->
  <link 
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" 
    rel="stylesheet"
  />

  <!-- Tema custom -->
  <style>
    :root {
      --fla-red: #c8102e;
      --fla-black: #111111;
    }

    body {
      background-color: #f5f5f5;
    }

    .bg-fla {
      background: linear-gradient(90deg, var(--fla-black), var(--fla-red));
    }

    .text-fla {
      color: var(--fla-red);
    }

    .btn-fla {
      background-color: var(--fla-red);
      color: white;
      border: none;
    }

    .btn-fla:hover {
      background-color: #a50d24;
    }

    .card-fla {
      border-left: 5px solid var(--fla-red);
    }
  </style>
</head>

<body>

  <!-- NAVBAR -->
  <nav class="navbar navbar-dark bg-fla shadow">
    <div class="container">
      <span class="navbar-brand fw-bold">
        🔴⚫ Flamengo 
      </span>
    </div>
  </nav>

  <!-- CONTEÚDO -->
  <div class="container py-4">

    <!-- TÍTULO -->
    <div class="mb-4">
      <h2 class="fw-bold text-fla">Bem-vindo</h2>
      <p class="text-muted">Painel de controle do sistema</p>
    </div>

    <!-- CARDS -->
    <div class="row g-4 mb-4">

      <div class="col-md-4">
        <div class="card card-fla shadow-sm">
          <div class="card-body text-center">
            <i class="bi bi-people fs-1 text-fla"></i>
            <h5 class="mt-2">Clientes</h5>
            <h3 id="total-customers">0</h3>
          </div>
        </div>
      </div>

      <div class="col-md-4">
        <div class="card card-fla shadow-sm">
          <div class="card-body text-center">
            <i class="bi bi-person-plus fs-1 text-fla"></i>
            <h5 class="mt-2">Novos</h5>
            <h3 id="new-customers">0</h3>
          </div>
        </div>
      </div>

      <div class="col-md-4">
        <div class="card card-fla shadow-sm">
          <div class="card-body text-center">
            <i class="bi bi-graph-up fs-1 text-fla"></i>
            <h5 class="mt-2">Atividade</h5>
            <h3 id="activity">0%</h3>
          </div>
        </div>
      </div>

    </div>

    <!-- AÇÕES -->
    <div class="card shadow-sm">
      <div class="card-body">

        <h5 class="mb-3 text-fla">
          <i class="bi bi-lightning-charge"></i> Ações rápidas
        </h5>

        <div class="d-flex gap-3 flex-wrap">
          <a href="#" class="btn btn-fla">
            <i class="bi bi-plus-lg"></i> Novo Cliente
          </a>

          <a href="#" class="btn btn-dark">
            <i class="bi bi-list"></i> Ver Clientes
          </a>
        </div>

      </div>
    </div>

  </div>

  <!-- Bootstrap -->
  <script 
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
  </script>

  <!-- Vite -->
  <script type="module" src="/src/main.js"></script>

</body>
</html>
